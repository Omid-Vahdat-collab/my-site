backend:
  name: github
  repo: Omid-Vahdat/YOUR_REPO_NAME # نام کاربری و اسم ریپازیتوری شما
  branch: main # یا master

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "books"
    label: "کتاب‌ها"
    folder: "content/books"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "عنوان", name: "title", widget: "string" }
      - { label: "تاریخ انتشار", name: "date", widget: "datetime" }
      - { label: "تصویر جلد", name: "image", widget: "image" }
      - { label: "محتوا/توضیحات", name: "body", widget: "markdown" }
